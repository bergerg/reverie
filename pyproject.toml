[project]
name = "reverie"
version = "0.1.0"
description = "Local-first index and MCP server for Claude Code session transcripts."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
]

[project.scripts]
reverie = "reverie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverie"]
